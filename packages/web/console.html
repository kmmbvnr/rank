<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:,">
    <title>Rank console</title>
</head>
<body>
    <header id="chrome">
        <span id="brand" aria-label="Rank">RANK</span>
        <button id="menu-toggle" aria-label="Terminal commands" aria-expanded="false" aria-controls="commands">⋮</button>
        <nav id="commands" aria-label="Terminal commands" hidden>
            <button data-key="r" data-ctrl="true">Run through selected line</button>
            <button data-key="l" data-ctrl="true">Run all from start</button>
            <button data-key="g" data-ctrl="true">Select iteration</button>
            <div class="arrows">
                <button data-key="left" aria-label="Left">←</button>
                <button data-key="up" aria-label="Up">↑</button>
                <button data-key="down" aria-label="Down">↓</button>
                <button data-key="right" aria-label="Right">→</button>
            </div>
            <button data-debug data-key="t" hidden>Step into line</button>
            <button data-debug data-key="n" hidden>Next iteration</button>
            <button data-debug data-key="g" hidden>Return to main</button>
            <button data-key="tab">Complete</button>
            <button data-key="escape">Edit</button>
            <button data-key="c" data-ctrl="true">Stop</button>
        </nav>
    </header>
    <main id="terminal" aria-label="Rank terminal">
        <div id="screen" role="region" aria-label="Rank notebook"></div>
        <div id="caret" aria-hidden="true"></div>
        <textarea id="input" aria-label="Rank terminal input" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" enterkeyhint="enter"></textarea>
    </main>
    <button id="run-button" type="button" aria-label="Run through selected line; hold to run all from start">
        <svg class="run-progress" viewBox="0 0 72 72" aria-hidden="true">
            <rect class="run-progress-track" x="4" y="4" width="64" height="64" rx="20"></rect>
            <rect class="run-progress-ring" x="4" y="4" width="64" height="64" rx="20" pathLength="100"></rect>
        </svg>
        <svg class="run-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="play-icon" d="M8 5v14l11-7z"></path>
            <path class="step-icon" d="M5 5v14l10-7zM17 5h3v14h-3z"></path>
            <path class="pause-icon" d="M6 5h4v14H6zM14 5h4v14h-4z"></path>
        </svg>
    </button>
    <span id="measure" aria-hidden="true">0000000000</span>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
