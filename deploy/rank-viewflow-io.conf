server {
    listen 80;
    listen [::]:80;
    server_name rank.viewflow.io;

    location /.well-known/acme-challenge/ {
        root /srv/rank-viewflow-io/.letsencrypt;
    }
    location / {
        return 301 https://rank.viewflow.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rank.viewflow.io;

    ssl_certificate     /etc/letsencrypt/live/rank.viewflow.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rank.viewflow.io/privkey.pem;

    root /srv/rank-viewflow-io/public;
    index index.html;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    location /.well-known/acme-challenge/ {
        root /srv/rank-viewflow-io/.letsencrypt;
    }
    location = /bench {
        return 301 /bench/;
    }
    location ^~ /bench/ {
        alias /srv/rank-bench/public/;
        index dashboard.html index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/__rank_euler/([A-Za-z0-9_.-]+)$ {
        proxy_pass https://projecteuler.net/resources/documents/$1;
        proxy_set_header Host projecteuler.net;
        proxy_set_header Accept-Encoding identity;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
    }
}
