name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm ci
      - run: npm test
      - name: Verify Euler 1–10 Rust rewrites
        if: matrix.node == 22
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rank-euler-target
        run: npm run test:rust
