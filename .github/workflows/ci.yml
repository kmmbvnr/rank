name: CI

# Actions minutes are metered: PRs run the light suites only,
# the full set (sharded audits, rust) runs on manual dispatch.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '{"include":[{"suite":"packages"},{"suite":"cli"},{"suite":"interpreter"},{"suite":"type-audit","shard":0},{"suite":"type-audit","shard":1},{"suite":"type-audit","shard":2},{"suite":"type-audit","shard":3},{"suite":"differential","shard":0},{"suite":"differential","shard":1},{"suite":"differential","shard":2},{"suite":"differential","shard":3},{"suite":"rust"}]}' || '{"include":[{"suite":"packages"},{"suite":"interpreter"}]}') }}
    name: ${{ matrix.suite }} ${{ matrix.shard }} (Node 24)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install expect for CLI tests
        if: matrix.suite == 'cli'
        run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm ci
      - name: Build all packages
        if: matrix.suite == 'packages'
        run: npm run build
      - name: Build test dependencies
        if: matrix.suite != 'packages'
        run: npm run langium:generate && npx tsc -b tsconfig.build.json
      - name: Check sources and test packages
        if: matrix.suite == 'packages'
        run: |
          npm run check:semantic-boundaries
          npm run check:application-forms
          npm test --workspace @arrrank/language --workspace @arrrank/common --workspace @arrrank/compile
      - name: Test CLI
        if: matrix.suite == 'cli'
        run: |
          npm run build --workspace @arrrank/cli
          npm test --workspace @arrrank/cli
      - name: Test interpreter
        if: matrix.suite == 'interpreter'
        run: |
          npm test --workspace @arrrank/interpreter -- --exclude test/types.test.ts --exclude test/differential.test.ts --exclude test/nurikabe.test.ts
          npm test --workspace @arrrank/interpreter -- test/nurikabe.test.ts
      - name: Test release library Euler examples
        if: matrix.suite == 'interpreter'
        run: |
          for file in demos/euler/0{01..15}_*_test.ra; do
            node packages/cli/bin/cli.js test "$file" || exit 1
          done
      - name: Audit inferred types
        if: matrix.suite == 'type-audit'
        env:
          RANK_TYPE_AUDIT_SHARDS: 4
          RANK_TYPE_AUDIT_SHARD: ${{ matrix.shard }}
          RANK_TYPE_AUDIT_SUMMARY: type-audit-${{ matrix.shard }}.json
        run: npm test --workspace @arrrank/interpreter -- test/types.test.ts
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'type-audit'
        with:
          name: type-audit-${{ matrix.shard }}
          path: packages/interpreter/type-audit-${{ matrix.shard }}.json
      - name: Compare compiled and reference execution
        if: matrix.suite == 'differential'
        env:
          RANK_DIFFERENTIAL_SHARDS: 4
          RANK_DIFFERENTIAL_SHARD: ${{ matrix.shard }}
          RANK_DIFFERENTIAL_SUMMARY: differential-${{ matrix.shard }}.json
        run: npm test --workspace @arrrank/interpreter -- test/differential.test.ts
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'differential'
        with:
          name: differential-${{ matrix.shard }}
          path: packages/interpreter/differential-${{ matrix.shard }}.json
      - name: Verify Euler 1–10 Rust rewrites
        if: matrix.suite == 'rust'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rank-euler-target
        run: npm run test:rust

  type-audit-coverage:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: type-audit-*
          path: type-audit-results
          merge-multiple: true
      - run: node scripts/check-type-audit.mjs type-audit-results/type-audit-*.json

  differential-coverage:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: differential-*
          path: differential-results
          merge-multiple: true
      - run: node scripts/check-differential.mjs differential-results/differential-*.json
