name: CI

# Actions minutes are metered. PRs retain package/interpreter checks,
# bounded corpus audits run on manual dispatch. Full inputs are opt-in.
# Rust verification is paused.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_scale:
        description: Run the slow published inputs as well
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_scale && matrix.suite == 'differential' && 120 || inputs.full_scale && 30 || 15 }}
    env:
      RANK_DEMO_AUDIT_SCALE: ${{ inputs.full_scale && 'full' || 'small' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '{"include":[{"suite":"packages"},{"suite":"cli","shard":"1/2"},{"suite":"cli","shard":"2/2"},{"suite":"interpreter","shard":"1/4"},{"suite":"interpreter","shard":"2/4"},{"suite":"interpreter","shard":"3/4"},{"suite":"interpreter","shard":"4/4"},{"suite":"name-facts","shard":0},{"suite":"name-facts","shard":1},{"suite":"name-facts","shard":2},{"suite":"name-facts","shard":3},{"suite":"type-audit","shard":0},{"suite":"type-audit","shard":1},{"suite":"type-audit","shard":2},{"suite":"type-audit","shard":3},{"suite":"differential","shard":0},{"suite":"differential","shard":1},{"suite":"differential","shard":2},{"suite":"differential","shard":3},{"suite":"differential","shard":4},{"suite":"differential","shard":5},{"suite":"differential","shard":6},{"suite":"differential","shard":7},{"suite":"differential","shard":8},{"suite":"differential","shard":9},{"suite":"differential","shard":10},{"suite":"differential","shard":11},{"suite":"differential","shard":12},{"suite":"differential","shard":13},{"suite":"differential","shard":14},{"suite":"differential","shard":15}]}' || '{"include":[{"suite":"packages"},{"suite":"interpreter","shard":"1/4"},{"suite":"interpreter","shard":"2/4"},{"suite":"interpreter","shard":"3/4"},{"suite":"interpreter","shard":"4/4"}]}') }}
    name: ${{ matrix.suite }} ${{ matrix.shard }} (Node 24)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install expect for CLI tests
        if: matrix.suite == 'cli'
        run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm ci
      - name: Build all packages
        if: matrix.suite == 'packages'
        run: npm run build
      - name: Build test dependencies
        if: matrix.suite != 'packages'
        run: npm run langium:generate && npx tsc -b tsconfig.build.json
      - name: Check sources and test packages
        if: matrix.suite == 'packages'
        run: |
          npm run check:semantic-boundaries
          npm run check:application-forms
          npm test --workspace @arrrank/language --workspace @arrrank/compile
          npm test --workspace @arrrank/common -- --exclude test/name-facts-corpus.test.ts
      - name: Test CLI
        if: matrix.suite == 'cli'
        run: |
          npm run build --workspace @arrrank/cli
          npm test --workspace @arrrank/cli -- --test-shard="${{ matrix.shard }}"
      - name: Audit name facts against demo execution
        if: matrix.suite == 'name-facts'
        env:
          RANK_NAME_FACTS_SHARDS: 4
          RANK_NAME_FACTS_SHARD: ${{ matrix.shard }}
          RANK_NAME_FACTS_SUMMARY: name-facts-${{ matrix.shard }}.json
        run: npm test --workspace @arrrank/common -- test/name-facts-corpus.test.ts --maxWorkers=1 --reporter=verbose
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'name-facts'
        with:
          name: name-facts-${{ matrix.shard }}
          path: packages/common/name-facts-${{ matrix.shard }}.json
      - name: Test interpreter
        if: matrix.suite == 'interpreter'
        env:
          RANK_INTERPRETER_SHARD: ${{ matrix.shard }}
        run: |
          npm test --workspace @arrrank/interpreter -- --exclude test/types.test.ts --exclude test/differential.test.ts --exclude test/nurikabe.test.ts --exclude test/full-scale-demos.test.ts --exclude test/euler-neighbours-full.test.ts --shard="$RANK_INTERPRETER_SHARD"
          if [ "$RANK_INTERPRETER_SHARD" = "1/4" ]; then
            npm test --workspace @arrrank/interpreter -- test/nurikabe.test.ts
          fi
      - name: Test release library Euler examples
        if: matrix.suite == 'interpreter' && matrix.shard == '1/4'
        run: |
          for file in demos/euler/0{01..15}_*_test.ra; do
            node packages/cli/bin/cli.js test "$file" || exit 1
          done
      - name: Audit inferred types
        if: matrix.suite == 'type-audit'
        env:
          RANK_TYPE_AUDIT_SHARDS: 4
          RANK_TYPE_AUDIT_SHARD: ${{ matrix.shard }}
          RANK_TYPE_AUDIT_SUMMARY: type-audit-${{ matrix.shard }}.json
        run: npm test --workspace @arrrank/interpreter -- test/types.test.ts
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'type-audit'
        with:
          name: type-audit-${{ matrix.shard }}
          path: packages/interpreter/type-audit-${{ matrix.shard }}.json
      - name: Compare compiled and reference execution
        if: matrix.suite == 'differential'
        env:
          RANK_DIFFERENTIAL_SHARDS: 16
          RANK_DIFFERENTIAL_SHARD: ${{ matrix.shard }}
          RANK_DIFFERENTIAL_SUMMARY: differential-${{ matrix.shard }}.json
        run: npm test --workspace @arrrank/interpreter -- test/differential.test.ts
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'differential'
        with:
          name: differential-${{ matrix.shard }}
          path: packages/interpreter/differential-${{ matrix.shard }}.json

  full-scale:
    if: github.event_name == 'workflow_dispatch' && inputs.full_scale
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RANK_FULL_SCALE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run langium:generate && npx tsc -b tsconfig.build.json
      - run: npm test --workspace @arrrank/interpreter -- --exclude test/types.test.ts --exclude test/differential.test.ts --exclude test/nurikabe.test.ts

  type-audit-coverage:
    needs: test
    env:
      RANK_DEMO_AUDIT_SCALE: ${{ inputs.full_scale && 'full' || 'small' }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: type-audit-*
          path: type-audit-results
          merge-multiple: true
      - run: node scripts/check-type-audit.mjs type-audit-results/type-audit-*.json

  differential-coverage:
    needs: test
    env:
      RANK_DEMO_AUDIT_SCALE: ${{ inputs.full_scale && 'full' || 'small' }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: differential-*
          path: differential-results
          merge-multiple: true
      - run: node scripts/check-differential.mjs --shards 16 differential-results/differential-*.json

  name-facts-coverage:
    needs: test
    env:
      RANK_DEMO_AUDIT_SCALE: ${{ inputs.full_scale && 'full' || 'small' }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: name-facts-*
          path: name-facts-results
          merge-multiple: true
      - run: node scripts/check-name-facts.mjs name-facts-results/name-facts-*.json
